# Tack web preview on Fly.io: one always-on machine, built from the Dockerfile.
# Sessions, the trace stream and the limits live in that one process, so keep it to a single machine.

app = "tack-preview"
primary_region = "bom"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  TACK_HOSTED = "1"
  PORT = "8080"
  TACK_STATE_DIR = "/tmp/tack"
  TACK_TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
